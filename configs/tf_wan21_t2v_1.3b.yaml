# TF/FCP recipe. Acquire base weights and prepare or download the matching demo first.
model_name: Wan2.1-T2V-1.3B
timestep_shift: 5.0
guidance_scale: 3.0
mixed_precision: true
sharding_strategy: hybrid_full
lr_warmup_steps: 1000
batch_size: 1
ema_weight: 0.999
ema_checkpoint_mode: default
ema_start_step: 2000
max_iters: 20000
log_iters: 500
snapshot_iters: 10000
seed: 42
num_workers: 8
image_or_video_shape:
- 1
- 22
- 16
- 54
- 96
gradient_checkpointing: true
num_frame_per_block: 3
independent_first_frame: true
condition_only_first_frame: true
model_kwargs:
  timestep_shift: 5.0
data_path: null
annotation_path: null
data_sources:
- id: source_a
  data_path: release_assets/dataset_demo/wan21_t2v_1.3b/source_a/latent_shards
  annotation_path: release_assets/dataset_demo/wan21_t2v_1.3b/source_a/annotations.jsonl
  weight: 1.0
- id: source_b
  data_path: release_assets/dataset_demo/wan21_t2v_1.3b/source_b/latent_shards
  annotation_path: release_assets/dataset_demo/wan21_t2v_1.3b/source_b/annotations.jsonl
  weight: 1.0
max_grad_norm: 0.1
future_prediction:
  enabled: false
optimizer_config:
  adamw:
    lr: 1.0e-05
    beta1: 0.0
    beta2: 0.999
    weight_decay: 0.01
